[workspace]
members = ["crates/aoc", "crates/double-buffer", "crates/grid", "crates/quant"]

[package]
name = "aoc2025"
version = "0.1.0"
edition = "2024"

[dependencies]
aoc = { path = "crates/aoc" }
quant = { path = "crates/quant" }
grid = { path = "crates/grid" }
double-buffer = { path = "crates/double-buffer" }

colored = "3.0.0"
itertools = "0.14.0"
phf = { version = "0.13.1", features = ["macros"] }
regex = "1.12.2"


[profile.release]
opt-level = 3
